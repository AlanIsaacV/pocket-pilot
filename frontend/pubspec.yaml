name: pocket_pilot
description: "Pocket Pilot — app de finanzas personales."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Manejo de estado ---
  # Provider es la solución oficial de Google para state management.
  # Usamos ChangeNotifier + Consumer para notificar a la UI de cambios.
  provider: ^6.1.2

  # --- Navegación ---
  # go_router es el router declarativo oficial de Flutter.
  # Permite rutas nombradas, ShellRoute (tabs persistentes), deep links, etc.
  go_router: ^17.1.0

  # --- Base de datos local (SQLite) ---
  # sqflite: cliente SQLite puro para Flutter (iOS/Android/macOS).
  # path: utilidades para construir rutas de archivo cross-platform.
  sqflite: ^2.4.1
  path: ^1.9.0

  # --- gRPC ---
  # grpc: cliente gRPC para Dart. Se conecta a nuestro backend en Go.
  # protobuf: runtime para los mensajes proto.
  # fixnum: tipos int64 usados en los campos de dinero del proto.
  #   Es una dependencia transitiva de protobuf, pero la declaramos
  #   explícitamente para silenciar la advertencia del linter.
  # Los archivos .pb.dart generados con protoc-gen-dart usan APIs de protobuf 6.x
  # (well_known_types path, métodos aE, pPM, aInt64).
  # grpc 5.x depende de protobuf 6.x — compatibles entre sí.
  grpc: ^5.0.0
  protobuf: ^6.0.0
  fixnum: ^1.1.0

  # --- Conectividad ---
  # Detecta cambios de red (WiFi, datos móviles, sin conexión).
  # ConnectivityMonitor lo usa para lanzar sync automático al reconectar.
  connectivity_plus: ^7.0.0

  # --- IDs únicos ---
  # Genera UUIDs v4 para los IDs de entidades creadas localmente.
  uuid: ^4.5.1

  # --- CSV ---
  # Parser de archivos CSV para la funcionalidad de importación.
  csv: ^8.0.0

  # --- File Picker ---
  # Selector de archivos nativo para importación de CSV.
  file_picker: ^11.0.2

  # --- Tipografía ---
  # google_fonts: descarga y cachea fuentes de Google Fonts en runtime.
  # Usamos Space Grotesk (números), Outfit (títulos) e Inter (cuerpo).
  google_fonts: ^8.0.2

  # --- Voz ---
  # speech_to_text: convierte voz a texto para el asistente.
  # flutter_tts: sintetiza respuestas del asistente en voz.
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # --- Auth ---
  # google_sign_in: obtiene el OIDC id_token de Google.
  # sign_in_with_apple: obtiene el identity token de Apple.
  # flutter_secure_storage: almacenamiento cifrado para tokens.
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  flutter_secure_storage: ^10.0.0

  # --- Notificaciones locales ---
  # flutter_local_notifications: programa alertas del SO sin backend.
  # timezone + flutter_timezone: requeridos por zonedSchedule().
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2

  # --- Gráficas ---
  # fl_chart: librería declarativa de Flutter para gráficas (barras, líneas, pie).
  # Usada en la tab de Estadísticas del dashboard.
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/migrations/
    - assets/categories/
