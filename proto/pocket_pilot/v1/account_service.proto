syntax = "proto3";

package pocket_pilot.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pocket_pilot/v1/common.proto";

option go_package = "github.com/AlanIsaacV/pocket-pilot/backend/internal/gen/proto/pocket_pilot/v1;pocketpilotv1";

enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_BANK = 1;
  ACCOUNT_TYPE_CASH = 2;
  ACCOUNT_TYPE_CREDIT_CARD = 3;
  ACCOUNT_TYPE_LOAN = 4;
  ACCOUNT_TYPE_INVESTMENT = 5;
  ACCOUNT_TYPE_CRYPYO = 6;
  ACCOUNT_TYPE_OTHER = 7;
}

message Account {
  string id = 1;
  string name = 2;
  AccountType type = 3;
  int64 credit_limit_cents = 4;
  int32 statement_day = 5;
  int32 payment_due_day = 6;
  int32 interest_rate_apr = 7;
  int32 term_months = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp deleted_at = 11;
  string currency_code = 12;
}

service AccountService {
  // Trae cuentas del usuario autenticado. Si updated_since está definido, solo retorna
  // registros modificados después de ese timestamp (delta sync).
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);

  // Crea o actualiza una cuenta. Aplica Last Write Wins por updated_at:
  // si el servidor tiene una versión más reciente, retorna esa versión
  // con conflict_resolved = true.
  rpc UpsertAccount(UpsertAccountRequest) returns (UpsertAccountResponse);

  // Elimina lógicamente una cuenta (soft delete con LWW por deleted_at).
  rpc DeleteAccount(DeleteAccountRequest) returns (google.protobuf.Empty);
}

message ListAccountsRequest {
  // Si es null, trae todos los registros (primer sync).
  // Si está definido, solo registros con updated_at > updated_since.
  google.protobuf.Timestamp updated_since = 1;
  PageRequest page = 2;
}

message ListAccountsResponse {
  repeated Account accounts = 1;
  PageResponse page = 2;
  // Timestamp del servidor al momento de ejecutar la query.
  // El cliente debe guardar este valor como last_synced_at.
  google.protobuf.Timestamp synced_at = 3;
}

message UpsertAccountRequest {
  Account account = 1;
}

message UpsertAccountResponse {
  // Versión aceptada del registro (puede ser la del cliente o la del servidor).
  Account account = 1;
  // true si el servidor tenía una versión más reciente y hubo conflicto LWW.
  // En ese caso, el cliente debe actualizar su copia local con account.
  bool conflict_resolved = 2;
}

message DeleteAccountRequest {
  string id = 1;
  // Timestamp de la eliminación en el cliente, usado para LWW.
  google.protobuf.Timestamp deleted_at = 2;
}
