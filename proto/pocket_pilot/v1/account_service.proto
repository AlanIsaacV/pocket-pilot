// =============================================================================
// account_service.proto
// CRUD for financial accounts (bank accounts, cash wallets, credit cards, etc.)
// =============================================================================
syntax = "proto3";

package pocket_pilot.v1;

option go_package = "github.com/AlanIsaacV/pocket-pilot/backend/internal/gen/proto/pocket_pilot/v1;pocketpilotv1";

import "google/protobuf/timestamp.proto";
import "pocket_pilot/v1/common.proto";

// ---------------------------------------------------------------------------
// Enum
// ---------------------------------------------------------------------------
enum AccountType {
    ACCOUNT_TYPE_UNSPECIFIED = 0; // proto3 requires a zero value
    ACCOUNT_TYPE_CHECKING    = 1;
    ACCOUNT_TYPE_SAVINGS     = 2;
    ACCOUNT_TYPE_CREDIT_CARD = 3;
    ACCOUNT_TYPE_CASH        = 4;
    ACCOUNT_TYPE_INVESTMENT  = 5;
}

// ---------------------------------------------------------------------------
// Core message — mirrors the DB row
// ---------------------------------------------------------------------------
message Account {
    string      id              = 1; // UUID as string
    string      user_id         = 2; // UUID as string
    string      name            = 3;
    AccountType type            = 4;
    Money       initial_balance = 5;
    // Audit timestamps — populated by the server, ignored on create/update
    google.protobuf.Timestamp created_at = 6;
    google.protobuf.Timestamp updated_at = 7;
}

// ---------------------------------------------------------------------------
// RPC Request / Response messages
// ---------------------------------------------------------------------------

// --- Create ---
message CreateAccountRequest {
    string      user_id         = 1;
    string      name            = 2;
    AccountType type            = 3;
    Money       initial_balance = 4;
}
message CreateAccountResponse {
    Account account = 1;
}

// --- Get ---
message GetAccountRequest {
    string user_id    = 1;
    string account_id = 2;
}
message GetAccountResponse {
    Account account = 1;
}

// --- List ---
message ListAccountsRequest {
    string      user_id    = 1;
    PageRequest pagination = 2;
}
message ListAccountsResponse {
    repeated Account accounts   = 1;
    PageResponse     pagination = 2;
}

// --- Update ---
// Partial updates: only non-zero fields are applied (server-side logic).
// A cleaner approach for production would use google.protobuf.FieldMask,
// but for MVP this pattern is simpler to implement.
message UpdateAccountRequest {
    string      user_id    = 1;
    string      account_id = 2; // identifies which account to update
    string      name       = 3;
    AccountType type       = 4;
    Money       initial_balance = 5;
}
message UpdateAccountResponse {
    Account account = 1;
}

// --- Delete (soft delete) ---
message DeleteAccountRequest {
    string user_id    = 1;
    string account_id = 2;
}
message DeleteAccountResponse {
    // Empty — success is implied by the absence of an error status.
    // gRPC uses status codes (OK, NOT_FOUND, etc.) for error signaling,
    // not boolean fields.
}

// ---------------------------------------------------------------------------
// Service definition
// ---------------------------------------------------------------------------
service AccountService {
    rpc CreateAccount (CreateAccountRequest) returns (CreateAccountResponse);
    rpc GetAccount    (GetAccountRequest)    returns (GetAccountResponse);
    rpc ListAccounts  (ListAccountsRequest)  returns (ListAccountsResponse);
    rpc UpdateAccount (UpdateAccountRequest) returns (UpdateAccountResponse);
    rpc DeleteAccount (DeleteAccountRequest) returns (DeleteAccountResponse);
}
