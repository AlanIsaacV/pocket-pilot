syntax = "proto3";

package pocket_pilot.v1;

import "google/protobuf/timestamp.proto";
import "pocket_pilot/v1/common.proto";

option go_package = "github.com/AlanIsaacV/pocket-pilot/backend/internal/gen/proto/pocket_pilot/v1;pocketpilotv1";

// BankPackage es una entrada del catálogo global de paquetes de apps bancarias.
// La tabla es compartida entre todos los usuarios (sin user_id) y se distribuye
// pull-only: el cliente nunca empuja entradas al catálogo. Las nuevas entradas
// llegan vía promoción de PackageSuggestion (ver SubmitPackageSuggestion) por
// parte del admin.
//
// Cuando un cliente marca un package como banco en su pantalla "Mis bancos",
// si el package_name aparece aquí prefilla el bank_id y default_label en el
// BankAlias local (ver bank_alias_service.proto). Si no, el alias queda con
// bank_id vacío y display_label = lo que el usuario escribió.
message BankPackage {
  // Natural key. Nombre técnico del package (ej. "com.bbva.bancomermovil").
  string package_name = 1;

  // Identificador del banco compartido con notification_parsers.bank_id
  // (ej. "bbva_mx"). Permite que un parser global aplique al package
  // automáticamente sin configuración del usuario.
  string bank_id = 2;

  // Etiqueta sugerida para mostrar en UI ("BBVA"). El usuario puede sobre-
  // escribir en su BankAlias local.
  string default_label = 3;

  google.protobuf.Timestamp updated_at = 4;
  google.protobuf.Timestamp deleted_at = 5;
}

service BankPackageService {
  // Lista entradas del catálogo global con semántica delta-pull. Los clientes
  // nunca empujan; los updates server-side se hacen vía promoción admin desde
  // package_suggestions.
  rpc ListBankPackages(ListBankPackagesRequest) returns (ListBankPackagesResponse);

  // Envía una sugerencia anónima cuando el usuario marca un package como banco
  // y el toggle help_improve_app está activo. El backend persiste sin user_id
  // en la tabla package_suggestions; un admin la revisa y decide si promueve
  // a BankPackage. Idempotente a nivel de aplicación: el cliente puede invocar
  // varias veces para el mismo package — el admin tooling deduplica antes de
  // promover.
  rpc SubmitPackageSuggestion(SubmitPackageSuggestionRequest) returns (SubmitPackageSuggestionResponse);
}

message ListBankPackagesRequest {
  google.protobuf.Timestamp updated_since = 1;
  PageRequest page = 2;
}

message ListBankPackagesResponse {
  repeated BankPackage packages = 1;
  PageResponse page = 2;
  google.protobuf.Timestamp synced_at = 3;
}

message SubmitPackageSuggestionRequest {
  // Nombre técnico del package observado (ej. "com.banorte.movil").
  string package_name = 1;

  // bank_id propuesto por el cliente cuando el usuario lo eligió de un
  // dropdown poblado con BankPackage existentes. Vacío cuando es una
  // propuesta libre (alias custom para un banco no catalogado aún).
  string proposed_bank_id = 2;

  // Etiqueta libre que el usuario asignó. Requerido (mínimo 1 carácter).
  string proposed_label = 3;
}

message SubmitPackageSuggestionResponse {
  // ID asignado a la sugerencia. Útil para correlación en logs/debug. El
  // cliente no lo persiste (las sugerencias son fire-and-forget).
  string suggestion_id = 1;
}
