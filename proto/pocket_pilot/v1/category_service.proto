syntax = "proto3";

package pocket_pilot.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pocket_pilot/v1/common.proto";

option go_package = "github.com/AlanIsaacV/pocket-pilot/backend/internal/gen/proto/pocket_pilot/v1;pocketpilotv1";

enum CategoryType {
  CATEGORY_TYPE_UNSPECIFIED = 0;
  CATEGORY_TYPE_INCOME = 1;
  CATEGORY_TYPE_EXPENSE = 2;
}

message Category {
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp updated_at = 2;
  google.protobuf.Timestamp deleted_at = 3;
  string id = 4;
  string name = 5;
  string icon = 6;
  string color = 7;
  string parent_id = 8;
  CategoryType type = 9;
}

service CategoryService {
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc UpsertCategory(UpsertCategoryRequest) returns (UpsertCategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (google.protobuf.Empty);
}

message ListCategoriesRequest {
  google.protobuf.Timestamp updated_since = 1;
  PageRequest page = 2;
}

message ListCategoriesResponse {
  repeated Category categories = 1;
  PageResponse page = 2;
  google.protobuf.Timestamp synced_at = 3;
}

message UpsertCategoryRequest {
  Category category = 1;
}

message UpsertCategoryResponse {
  Category category = 1;
  bool conflict_resolved = 2;
}

message DeleteCategoryRequest {
  string id = 1;
  google.protobuf.Timestamp deleted_at = 2;
}
