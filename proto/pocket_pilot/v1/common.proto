syntax = "proto3";
package pocket_pilot.v1;

option go_package = "github.com/AlanIsaacV/pocket-pilot/backend/internal/gen/proto/pocket_pilot/v1;pocketpilotv1";
option java_multiple_files = true;

message Money {
  int64 amount_cents = 1; // e.g., 1050 for $10.50
  string currency_code = 2; // ISO 4217, e.g., "USD", "MXN"
}

message PageRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
}

enum FinancialNature {
  NATURE_UNSPECIFIED = 0;
  NATURE_REQUIRED    = 1; // Gastos: supermercado, renta, salud
  NATURE_OBLIGATION  = 2; // Gastos: impuestos, deudas, seguros
  NATURE_LIFESTYLE   = 3; // Gastos: entretenimiento, lujos, hobbies
  NATURE_ACTIVE      = 4; // Ingresos: salario, freelance
  NATURE_PASSIVE     = 5; // Ingresos: rendimientos, rentas
  NATURE_WINDFALL    = 6; // Ingresos: bonos, regalos, ventas ocasionales
  NATURE_ADJUSTMENT  = 7; // Ajustes manuales de saldo
}
