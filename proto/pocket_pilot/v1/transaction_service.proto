syntax = "proto3";

package pocket_pilot.v1;

import "pocket_pilot/v1/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/AlanIsaacV/pocket-pilot/backend/internal/gen/proto/pocket_pilot/v1;pocketpilotv1";

enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_INCOME = 1;
  TRANSACTION_TYPE_EXPENSE = 2;
  TRANSACTION_TYPE_TRANSFER = 3;
}

message Transaction {
  string id = 1;
  string user_id = 2;
  string account_id = 3;
  string category_id = 4;
  TransactionType type = 5;
  int64 amount_cents = 6;
  string currency_code = 7;
  string status = 8;
  repeated string tags = 9;
  string description = 10;
  google.protobuf.Timestamp date = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp deleted_at = 14;
}

service TransactionService {
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
  rpc UpsertTransaction(UpsertTransactionRequest) returns (UpsertTransactionResponse);
  rpc DeleteTransaction(DeleteTransactionRequest) returns (google.protobuf.Empty);
}

message ListTransactionsRequest {
  string user_id = 1;
  google.protobuf.Timestamp updated_since = 2;
  PageRequest page = 3;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  PageResponse page = 2;
  google.protobuf.Timestamp synced_at = 3;
}

message UpsertTransactionRequest {
  Transaction transaction = 1;
}

message UpsertTransactionResponse {
  Transaction transaction = 1;
  bool conflict_resolved = 2;
}

message DeleteTransactionRequest {
  string id = 1;
  string user_id = 2;
  google.protobuf.Timestamp deleted_at = 3;
}
